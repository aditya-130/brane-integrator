name: fed_single
version: 1.0.0
kind: ecu
base: python:3.10-slim
contributors:
  - name: Brane Integrator
entrypoint:
  kind: task
  exec: run.sh
files:
  - package.py
  - run.sh
actions:
  compute_local:
    command:
      args:
        - compute_local
    input:
      - name: local_data
        type: Data
    output:
      - name: output
        type: string
